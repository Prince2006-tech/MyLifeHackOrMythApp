name: Android CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'     # ← THIS WAS MISSING!
    - name: Setup Gradle
      run: chmod +x ./gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug
